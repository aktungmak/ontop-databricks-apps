bundle:
  name: ontop-vkg

variables:
  catalog:
    description: UC catalog for volume
  schema:
    description: UC schema for volume
  warehouse_cluster_size:
    default: Small
  ontop_version:
    default: "5.5.0"
  jdbc_version:
    default: "3.4.1"
  jre_version:
    default: "17.0.19_10"
  mapping_file:
    default: mapping.ttl
  ontology_file:
    default: ontology.ttl

targets:
  volume:
    default: true
    mode: production
    workspace:
      profile: DEFAULT
    resources:
      volumes:
        ontop_vkg_data:
          catalog_name: ${var.catalog}
          schema_name: ${var.schema}
          name: ontop_vkg
          volume_type: MANAGED

  mappings:
    mode: production
    workspace:
      profile: DEFAULT
      artifact_path: /Volumes/${var.catalog}/${var.schema}/ontop_vkg/mappings
    artifacts:
      mappings:
        path: ./mappings
        files:
          - source: ./mappings/${var.mapping_file}
          - source: ./mappings/${var.ontology_file}

  app:
    mode: production
    workspace:
      profile: DEFAULT
      artifact_path: /Volumes/${var.catalog}/${var.schema}/ontop_vkg/artifacts
    artifacts:
      ontop_runtime:
        path: .
        executable: bash
        build: |
          ONTOP_VERSION=${var.ontop_version} \
          JDBC_VERSION=${var.jdbc_version} \
          JRE_VERSION=${var.jre_version} \
          ./scripts/download-artifacts.sh
        files:
          - source: ./artifacts/ontop-cli-*.zip
          - source: ./artifacts/OpenJDK*jre*.tar.gz
          - source: ./artifacts/databricks-jdbc-*.jar
    resources:
      sql_warehouses:
        ontop_vkg_warehouse:
          name: ontop-vkg-wh
          warehouse_type: PRO
          enable_serverless_compute: true
          cluster_size: ${var.warehouse_cluster_size}
          auto_stop_mins: 10
          min_num_clusters: 1
          max_num_clusters: 1
          lifecycle:
            started: true

      apps:
        ontop_vkg:
          name: mcp-ontop-vkg
          description: Ontop VKG + MCP
          source_code_path: ./src/app
          # config replaces app.yaml wholesale per field, so command and the
          # full env list must both live here.
          config:
            command:
              - python
              - main.py
            env:
              - name: DATABRICKS_WAREHOUSE_ID
                value_from: sql-warehouse
              - name: MAPPINGS_VOLUME_PATH
                value_from: mappings-volume
              - name: VKG_MAPPING_FILE
                value: ${var.mapping_file}
              - name: VKG_ONTOLOGY_FILE
                value: ${var.ontology_file}
              - name: ONTOP_INTERNAL_PORT
                value: "18080"
              - name: FM_MODEL_NAME
                value: databricks-claude-opus-4-6
              - name: VKG_DEFAULT_CATALOG
                value: ${var.catalog}
              - name: VKG_DEFAULT_SCHEMA
                value: ${var.schema}
          user_api_scopes:
            - catalog.catalogs:read
            - catalog.schemas:read
            - catalog.tables:read
            - model-serving
            - sql
          resources:
            - name: sql-warehouse
              sql_warehouse:
                id: ${resources.sql_warehouses.ontop_vkg_warehouse.id}
                permission: CAN_USE
            - name: mappings-volume
              uc_securable:
                securable_type: VOLUME
                securable_full_name: ${var.catalog}.${var.schema}.ontop_vkg
                permission: READ_VOLUME
