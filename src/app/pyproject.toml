[project]
name = "ontop-databricks-app"
version = "0.1.0"
description = "Ontop Virtual Knowledge Graph served as a Databricks App."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.162.0",
    "httpx2>=2.16.0",
    "uvicorn>=0.54.0",
    "databricks-sdk>=0.160.0",
    "databricks-sql-connector[pyarrow]>=4.8.0",
    "pydantic>=2.14.1",
    "openai>=3.39.0",
    "rdflib>=7.6.0",
    "rapidfuzz>=3.14.6",
    "fastmcp>=4.1.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.1",
]

[tool.pytest]
markers = [
    "integration: requires a deployed Databricks App and live Ontop/DBSQL access",
]
