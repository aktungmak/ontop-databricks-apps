[project]
name = "ontop-databricks-app"
version = "0.1.0"
description = "Ontop Virtual Knowledge Graph served as a Databricks App."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "uvicorn>=0.30.0",
    "databricks-sdk>=0.40.0",
    "databricks-sql-connector[pyarrow]>=3.0.0",
    "pydantic>=2.0.0",
    "openai>=1.52.0",
    "rdflib>=7.0.0",
    "rapidfuzz>=3.0.0",
    "fastmcp>=3.0.0,<4.0.0",
]
